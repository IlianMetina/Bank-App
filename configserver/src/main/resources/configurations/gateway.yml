server:
  port: 8072

spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ms-accounts
              uri: lb://ms-accounts
              predicates:
                - Path=/api/accounts/**,/api/customers/**
            - id: ms-cards
              uri: lb://ms-cards
              predicates:
                - Path=/api/cards/**

eureka:
  instance:
    hostname: localhost
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/